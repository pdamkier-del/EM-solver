name: Parser recovery checks

on:
  push:
    branches:
      - parser-recovery-2026-11-04
  pull_request:
    branches:
      - exam-tech-ui-2026-11-04
  workflow_dispatch:

jobs:
  parser-and-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Parser tests
        run: python -m pytest -q tests/unit/test_text_parser_v2.py tests/unit/test_new_app.py tests/unit/test_assisted.py
      - name: Core regression smoke
        run: python -m pytest -q tests/unseen/test_new_problems.py
